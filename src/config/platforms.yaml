# Word count note: Tiếng Việt dùng split() tính syllables (âm tiết).
# Mỗi "từ" tiếng Việt thường = 1-2 âm tiết → số đếm cao hơn tiếng Anh ~1.5x.
# Ví dụ: "học sinh" = 2 âm tiết nhưng chỉ 1 khái niệm.
# Các giá trị min/max_words dưới đây đã được điều chỉnh theo syllable count thực tế.

facebook:
  post:
    min_words: 150   # ~100 âm tiết thực tế ≈ 150 syllables khi split()
    max_words: 600   # ~400 âm tiết thực tế ≈ 600 syllables khi split()
    optimal_words: 300
    hashtag_count: "3-5"
    format: "narrative"
    hook_position: "first 2 lines (before See More)"
    emoji: "moderate"
    cta_style: "soft invite"
    media: "1 image or video recommended"

instagram:
  carousel:
    slides: "5-7"
    words_per_slide: "30-60"   # 20-40 âm tiết thực tế → 30-60 syllables
    caption_words: "150-230"
    hashtag_count: "15-25"
    first_slide: "hook — question or stat"
    last_slide: "CTA + save prompt"
    format: "visual-first, text overlay"

  reels_script:
    duration: "15-30 seconds"
    hook_duration: "3 seconds"
    format: "vertical 9:16"
    caption_words: "75-150"
    hashtag_count: "10-15"
    hook_style: "pattern interrupt, curiosity gap"

tiktok:
  short_video_script:
    duration: "15-60 seconds"
    hook_duration: "3 seconds"
    format: "vertical 9:16"
    tone: "casual, conversational"
    hashtag_count: "3-5"
    text_overlays: true
    pace: "fast, change every 5-10s"
    trending_formats: ["storytime", "POV", "things I wish I knew", "unpopular opinion"]
    audio_suggestion: "required — must name specific song or 'Original sound'"
