id: tu_vi_la_so
description: >
  Brief hỏi về luận giải lá số. Retriever phải lấy đúng gói lá số, KHÔNG lấy
  khoá học Tarot. Nội dung không được hứa hẹn kết quả.
brand: tu_vi_demo
brief:
  raw_input: >
    Tạo campaign awareness cho dịch vụ luận giải lá số tử vi online,
    target Gen Z quan tâm tâm linh. Channel: Facebook.

expect:
  retrieval:
    must_load:
      - brand:identity
      - brand:tone_of_voice
      - product:goi_xem_la_so
      - audience:gen_z
    must_not_load:
      - product:khoa_hoc_tarot
    product_evidence: true

  content:
    # Ràng buộc pháp lý/brand — mã hoá thành thứ kiểm được thay vì hy vọng
    # reviewer bắt được
    must_not_contain:
      - cải mệnh đổi vận
      - đảm bảo chính xác 100%
      - chắc chắn giàu
      - chữa khỏi
    must_contain_any:
      - tử vi
      - lá số
    min_words: 100
    max_words: 600
