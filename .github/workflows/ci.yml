name: CI

on:
  push:
    branches: [main]
  pull_request:

# Huỷ run cũ khi push thêm vào cùng branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest httpx packaging

      - name: Run tests
        # Không có ANTHROPIC_API_KEY ở đây và đó là chủ ý: test nào gọi API
        # thật sẽ fail, đúng như mong muốn.
        env:
          ENV: dev
        run: pytest

      - name: Import smoke test
        env:
          ENV: dev
        run: python -c "import api.main, cli; print('imports ok')"

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci --include=dev

      - name: Lint
        working-directory: web
        # Có 5 warning exhaustive-deps tồn tại từ trước; gate ở errors.
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
